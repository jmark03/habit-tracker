<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper: #F1F1EE;
    --paper-elev: #FAFAFA;
    --ink: #1D2120;
    --ink-soft: #5C6360;
    --ink-faint: #8D9390;
    --line: #DADBD7;
    --line-strong: #C1C3BE;
    --moss: #47624A;
    --moss-deep: #2C3E2E;
    --moss-soft: #DCE3DB;
    --accent-vibrant: #268A4E;
    --accent-vibrant-deep: #1B6B3B;
    --amber: #B0863F;
    --amber-soft: #EDE2C9;
    --rust: #A24B3D;
    --radius-sm: 6px;
    --radius-md: 12px;
    --radius-full: 999px;
    --shadow-card: 0 1px 0 rgba(30,42,36,0.06);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
  }

  #app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 28px 80px;
  }

  /* ---------- Header ---------- */

  .ledger-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .ledger-title {
    font-family: 'Work Sans', sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'Work Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
  }

  .month-nav button {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: var(--paper-elev);
    color: var(--moss-deep);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .month-nav button:hover { background: var(--moss-soft); }
  .month-nav button:active { transform: scale(0.94); }
  .month-nav button:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }

  .section-gap {
    margin-top: 44px;
  }

  /* ---------- Calendar rhythm ---------- */

  .section-heading {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    margin: 0 0 14px;
  }

  .rhythm-label {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    margin: 0 0 14px;
  }

  .calendar-wrap {
    max-width: 336px;
    margin: 0 auto;
  }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 8px;
  }
  .cal-weekdays span {
    font-size: 10px;
    font-weight: 600;
    color: var(--ink-faint);
    text-align: center;
    letter-spacing: 0.02em;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-cell {
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    transition: transform 0.1s ease;
  }
  .cal-cell:not(.empty):hover { transform: scale(1.12); }
  .cal-cell.empty { background: transparent; }
  .cal-cell.today { box-shadow: 0 0 0 1.5px var(--rust); font-weight: 700; }

  .rhythm-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }

  .view-toggle {
    display: inline-flex;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-full);
    overflow: hidden;
  }
  .view-toggle button {
    padding: 6px 16px;
    font-family: 'Work Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    background: var(--paper-elev);
    color: var(--ink-soft);
    border: none;
    cursor: pointer;
  }
  .view-toggle button + button { border-left: 1px solid var(--line-strong); }
  .view-toggle button.active { background: var(--moss-deep); color: var(--paper-elev); }

  .year-nav {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Work Sans', sans-serif;
    font-size: 16px;
    color: var(--ink);
  }
  .year-nav button {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: var(--paper-elev);
    color: var(--moss-deep);
    cursor: pointer;
  }
  .year-nav button:hover { background: var(--moss-soft); }

  .year-loading {
    padding: 30px 0;
    text-align: center;
    color: var(--ink-faint);
    font-family: 'Work Sans', sans-serif;
    font-style: italic;
    font-size: 14px;
  }

  .year-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 24px 20px;
  }

  .mini-month-title {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--ink);
    margin: 0 0 8px;
    cursor: pointer;
  }
  .mini-month-title:hover { color: var(--moss-deep); }

  .mini-cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }
  .mini-cal-cell {
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .mini-cal-cell.empty { background: transparent; border-color: transparent; cursor: default; }
  .mini-cal-cell.today { box-shadow: 0 0 0 1.5px var(--rust); }
  .mini-cal-cell:hover { transform: scale(1.25); }

  .rhythm-filter {
    position: relative;
    display: inline-block;
    margin-bottom: 16px;
  }
  .filter-trigger {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: var(--radius-full);
    border: 1px solid var(--line-strong);
    background: var(--paper-elev);
    font-family: 'Work Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
  }
  .filter-trigger:hover { border-color: var(--moss); }
  .filter-trigger .chevron { font-size: 10px; color: var(--ink-faint); }

  .filter-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 190px;
    background: var(--paper-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    box-shadow: 0 12px 28px rgba(30, 42, 36, 0.2);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    z-index: 20;
  }
  .filter-option {
    text-align: left;
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    border: none;
    background: transparent;
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }
  .filter-option:hover { background: var(--moss-soft); }
  .filter-option.active {
    background: var(--moss-deep);
    color: var(--paper-elev);
  }

  .rhythm-legend {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 14px;
    font-size: 11px;
    color: var(--ink-faint);
  }
  .rhythm-legend .swatch {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
    border: 1px solid var(--line);
  }
  .colors-edit-link {
    background: none;
    border: none;
    color: var(--moss-deep);
    font-size: 11px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    margin-left: 8px;
  }

  .color-editor-rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
    max-height: 320px;
    overflow-y: auto;
  }
  .color-editor-section-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-faint);
    margin: 6px 0 2px;
    padding-top: 6px;
    border-top: 1px solid var(--line);
  }
  .color-editor-section-label:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  .color-editor-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink);
  }
  .color-editor-row input[type="color"] {
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    cursor: pointer;
    background: none;
    flex-shrink: 0;
  }
  .color-editor-row .swatch-preview {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .color-editor-label { flex: 1; }

  .new-color-preview {
    background: var(--paper);
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-sm);
    padding: 12px;
    margin-top: 4px;
  }
  .new-color-preview p {
    margin: 0 0 8px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .existing-scale-strip {
    display: flex;
    gap: 3px;
    margin-bottom: 10px;
  }
  .existing-scale-strip .swatch {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid var(--line);
  }


  /* ---------- Table ---------- */

  .ledger-table-wrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--paper-elev);
  }

  table.ledger {
    border-collapse: collapse;
    width: 100%;
    min-width: 720px;
  }

  table.ledger thead th {
    text-align: left;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--ink);
    padding: 14px 10px;
    border-bottom: 1px solid var(--line-strong);
    position: relative;
    white-space: nowrap;
  }

  table.ledger thead th.habit-col {
    text-align: center;
  }

  .habit-col-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .habit-icon { font-size: 16px; }
  .habit-name { font-size: 12px; }

  .habit-col-actions {
    position: absolute;
    top: 2px;
    right: 2px;
    display: none;
    gap: 2px;
  }
  table.ledger thead th.habit-col:hover .habit-col-actions { display: flex; }
  .habit-col-actions button {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: transparent;
    border: none;
    color: var(--ink-faint);
    font-size: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .habit-col-actions .edit-habit:hover { background: var(--moss); color: white; }
  .habit-col-actions .remove-habit:hover { background: var(--rust); color: white; }

  .habit-col[draggable] { cursor: grab; }
  .drag-handle {
    position: absolute;
    top: 2px;
    left: 2px;
    font-size: 9px;
    line-height: 1;
    color: var(--ink-faint);
    opacity: 0.5;
    letter-spacing: -2px;
    pointer-events: none;
  }
  table.ledger thead th.habit-col:hover .drag-handle { opacity: 1; }
  .habit-col.dragging { opacity: 0.4; }
  .habit-col.drag-over { box-shadow: inset 2px 0 0 var(--accent-vibrant); background: var(--moss-soft); }

  /* ---------- Modal dialogs ---------- */

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 42, 36, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  .modal-card {
    background: var(--paper-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    box-shadow: 0 16px 48px rgba(30, 42, 36, 0.28);
    padding: 24px;
    width: 100%;
    max-width: 360px;
  }
  .modal-title {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 18px;
    margin: 0 0 10px;
    color: var(--ink);
  }
  .modal-body {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0 0 20px;
    line-height: 1.5;
  }
  .modal-fields {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  .modal-fields .add-field input,
  .modal-fields .add-field select {
    width: 100%;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .btn-danger { background: var(--rust); color: var(--paper-elev); }
  .btn-danger:hover { background: #863D31; }

  table.ledger td {
    padding: 10px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    vertical-align: middle;
  }

  table.ledger tbody tr:last-child td { border-bottom: none; }
  table.ledger tbody tr:hover { background: rgba(79,111,82,0.045); }

  td.day-cell { white-space: nowrap; }
  .day-name { font-weight: 600; }
  .day-date { color: var(--ink-faint); font-size: 12px; }
  tr.today td.day-cell .day-name::after {
    content: "today";
    margin-left: 8px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--moss);
    background: var(--moss-soft);
    padding: 2px 6px;
    border-radius: var(--radius-md);
    vertical-align: middle;
  }

  td.habit-cell { text-align: center; }

  .check-btn {
    width: 26px;
    height: 26px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--line-strong);
    background: var(--paper);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
  }
  .check-btn:hover { border-color: var(--moss); }
  .check-btn:active { transform: scale(0.92); }
  .check-btn:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }
  .check-btn.checked {
    background: var(--accent-vibrant);
    border-color: var(--accent-vibrant-deep);
    color: var(--paper-elev);
  }

  .num-input {
    width: 68px;
    text-align: center;
    padding: 5px 4px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
  }
  .num-input:focus { outline: 2px solid var(--moss); border-color: var(--moss); }

  input[type="time"]::-webkit-calendar-picker-indicator {
    display: none;
    -webkit-appearance: none;
  }

  .time-input {
    width: 90px;
    text-align: center;
    padding: 5px 4px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
  }
  .time-input:focus { outline: 2px solid var(--moss); border-color: var(--moss); }

  td.score-cell {
    text-align: center;
    font-family: 'Work Sans', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--moss-deep);
  }

  tfoot td {
    padding: 12px 10px;
    font-size: 12px;
    color: var(--ink-soft);
    border-top: 2px solid var(--moss-deep);
  }
  tfoot td.habit-cell { text-align: center; }

  /* ---------- Add habit ---------- */

  .add-habit-col {
    text-align: center;
    vertical-align: middle;
  }
  .add-habit-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px dashed var(--line-strong);
    background: transparent;
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
  }
  .add-habit-btn:hover { border-color: var(--moss); color: var(--moss-deep); }

  .add-panel {
    margin-top: 16px;
    padding: 16px;
    background: var(--paper-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .add-field label {
    display: block;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .add-field input, .add-field select {
    padding: 7px 9px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--paper);
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
  }
  .icon-field {
    position: relative;
  }
  .emoji-trigger {
    width: 42px;
    height: 38px;
    font-size: 18px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--paper);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .emoji-trigger:hover { border-color: var(--moss); }
  .emoji-picker {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    width: 300px;
    background: var(--paper-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    box-shadow: 0 12px 28px rgba(30, 42, 36, 0.2);
    padding: 10px;
    z-index: 30;
  }
  .emoji-search {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--paper);
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 2px;
    max-height: 240px;
    overflow-y: auto;
  }
  .emoji-option {
    background: none;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 18px;
    padding: 5px 0;
    cursor: pointer;
  }
  .emoji-option:hover { background: var(--moss-soft); }
  .emoji-empty {
    grid-column: 1 / -1;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    padding: 12px 0;
  }
  .modal-fields .icon-field .emoji-custom-row input {
    width: 40px;
  }
  .emoji-custom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  .emoji-custom-row label {
    font-size: 11px;
    color: var(--ink-faint);
  }
  .emoji-custom-row input {
    width: 40px;
    text-align: center;
    padding: 5px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--paper);
    font-size: 15px;
  }
  .add-field input#new-habit-name { width: 160px; }

  .time-target-fields {
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    border: none;
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--moss-deep); color: var(--paper-elev); }
  .btn-primary:hover { background: var(--moss); }
  .btn-ghost { background: transparent; color: var(--ink-soft); }
  .btn-ghost:hover { color: var(--ink); }

  /* ---------- Stats ---------- */

  .stats-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 0 0 14px;
  }
  .stats-head h2.section-heading {
    margin: 0;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .stat-card {
    background: var(--paper-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 14px 16px;
  }
  .stat-card-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .stat-card-top .habit-icon { font-size: 15px; }
  .stat-card-top .habit-name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .stat-value {
    font-family: 'Work Sans', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--moss-deep);
    margin-bottom: 8px;
  }
  .bar-track {
    height: 6px;
    background: var(--line);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent-vibrant);

(function(){
  "use strict";

  var CONFIG_KEY = "habit-ledger:config";
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function pad(n){ return String(n).padStart(2,"0"); }
  function monthKey(y,m){ return y + "-" + pad(m+1); }
  function entriesKey(y,m){ return "habit-ledger:entries:" + monthKey(y,m); }
  function dateKeyOf(y,m,d){ return y + "-" + pad(m+1) + "-" + pad(d); }
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  function uid(){ return "h" + Math.random().toString(36).slice(2,9); }

  function timeToMinutes(t){
    var parts = String(t).split(":");
    if (parts.length !== 2) return null;
    var h = Number(parts[0]), m = Number(parts[1]);
    if (isNaN(h) || isNaN(m)) return null;
    return h * 60 + m;
  }
  function minutesToTime(mins){
    mins = ((Math.round(mins) % 1440) + 1440) % 1440;
    var h = Math.floor(mins / 60), m = mins % 60;
    return pad(h) + ":" + pad(m);
  }
  function formatTime12(t){
    var mins = timeToMinutes(t);
    if (mins === null) return t;
    var h = Math.floor(mins / 60), m = mins % 60;
    var period = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + pad(m) + " " + period;
  }
  function circularMeanMinutes(minsArray){
    // Treats the 24-hour clock as a circle so times that cross midnight
    // (e.g. 11:30 PM and 12:30 AM) average to ~midnight, not to noon.
    var sumSin = 0, sumCos = 0;
    minsArray.forEach(function(m){
      var angle = (m / 1440) * 2 * Math.PI;
      sumSin += Math.sin(angle);
      sumCos += Math.cos(angle);
    });
    var meanAngle = Math.atan2(sumSin / minsArray.length, sumCos / minsArray.length);
    if (meanAngle < 0) meanAngle += 2 * Math.PI;
    return (meanAngle / (2 * Math.PI)) * 1440;
  }

  // ---------- calendar color scale ----------
  // One color per possible daily score (0 habits met, 1 habit met, ... up to
  // the max). Fully customizable per score, rather than bucketed into a
  // fixed number of bands - this is what keeps every score visually distinct
  // no matter how many habits are being tracked.

  function hexToRgb(hex){
    var h = hex.replace("#", "");
    if (h.length === 3) h = h.split("").map(function(c){ return c + c; }).join("");
    var num = parseInt(h, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  function rgbToHex(r, g, b){
    return "#" + [r, g, b].map(function(v){
      return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
    }).join("");
  }

  function relativeLuminance(hex){
    var rgb = hexToRgb(hex);
    var a = [rgb.r, rgb.g, rgb.b].map(function(v){
      v = v / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
  }

  function textColorFor(bgHex){
    return relativeLuminance(bgHex) > 0.55 ? "var(--ink)" : "var(--paper-elev)";
  }

  function hslToRgb(h, s, l){
    s /= 100; l /= 100;
    var c = (1 - Math.abs(2*l - 1)) * s;
    var x = c * (1 - Math.abs((h/60) % 2 - 1));
    var m = l - c/2;
    var r,g,b;
    if (h < 60){ r=c; g=x; b=0; }
    else if (h < 120){ r=x; g=c; b=0; }
    else if (h < 180){ r=0; g=c; b=x; }
    else if (h < 240){ r=0; g=x; b=c; }
    else if (h < 300){ r=x; g=0; b=c; }
    else { r=c; g=0; b=x; }
    return [(r+m)*255, (g+m)*255, (b+m)*255];
  }

  function defaultColorScale(n){
    // Interpolating raw RGB between two muted colors just produces more
    // muted colors in between (low saturation reads as grey). Holding a
    // fixed green hue and ramping saturation + lightness instead keeps
    // every step recognizably green.
    var GREEN_HUE = 138;
    if (n <= 1) return [rgbToHex.apply(null, hslToRgb(GREEN_HUE, 12, 91))];
    var colors = [];
    for (var i = 0; i < n; i++){
      var t = i / (n - 1);
      var lightness = 91 - (91 - 24) * t;
      var saturation = 14 + (48 - 14) * t;
      colors.push(rgbToHex.apply(null, hslToRgb(GREEN_HUE, saturation, lightness)));
    }
    return colors;
  }

  // Pure computation, no persistence - used when we need a snapshot of the
  // color scale for a given max without triggering a save as a side effect.
  function computeScoreColorsFor(max){
    var need = max + 1;
    var existing = state.config.scoreColors || [];
    if (existing.length === need) return existing;
    var fresh = defaultColorScale(need);
    for (var i = 0; i < Math.min(existing.length, need); i++){ fresh[i] = existing[i]; }
    return fresh;
  }

  function getScoreColors(){
    var fresh = computeScoreColorsFor(maxScore());
    if (!state.config.scoreColors || state.config.scoreColors.length !== fresh.length){
      state.config = Object.assign({}, state.config, { scoreColors: fresh });
      saveConfig();
    }
    return fresh;
  }

  function colorForScore(score){
    var colors = getScoreColors();
    return colors[Math.max(0, Math.min(score, colors.length - 1))];
  }

  // ---------- storage ----------

  function loadConfig(){
    return window.storage.get(CONFIG_KEY).then(function(res){
      return res ? JSON.parse(res.value) : defaultConfig();
    }).catch(function(){
      return defaultConfig();
    });
  }

  function saveConfig(){
    return window.storage.set(CONFIG_KEY, JSON.stringify(state.config)).catch(function(e){
      console.error("Failed to save config", e);
    });
  }

  function loadEntries(y,m){
    return window.storage.get(entriesKey(y,m)).then(function(res){
      return res ? JSON.parse(res.value) : {};
    }).catch(function(){
      return {};
    });
  }

  function loadYearEntries(y){
    var jobs = [];
    for (var m = 0; m < 12; m++){
      jobs.push(loadEntries(y, m));
    }
    return Promise.all(jobs).then(function(results){
      var map = {};
      for (var m2 = 0; m2 < 12; m2++){ map[m2] = results[m2]; }
      return map;
    });
  }

  function ensureYearEntriesLoaded(){
    if (state.yearEntriesYear === state.year && state.yearEntries) return;
    state.yearLoading = true;
    loadYearEntries(state.year).then(function(map){
      state.yearEntries = map;
      state.yearEntriesYear = state.year;
      state.yearLoading = false;
      render();
    });
  }

  // ---------- export ----------

  function collectAllStoredMonths(){
    return window.storage.list("habit-ledger:entries:").then(function(listResult){
      var keys = (listResult && listResult.keys) || [];
      var monthEntries = {};
      return Promise.all(keys.map(function(k){
        var keyStr = typeof k === "string" ? k : ((k && k.key) || "");
        if (!keyStr) return null;
        return window.storage.get(keyStr).then(function(res){
          var mk = keyStr.replace("habit-ledger:entries:", "");
          monthEntries[mk] = res ? JSON.parse(res.value) : {};
        }).catch(function(){
          monthEntries[keyStr.replace("habit-ledger:entries:", "")] = {};
        });
      })).then(function(){ return monthEntries; });
    }).catch(function(e){
      console.error("Failed to list stored months for export", e);
      return {};
    });
  }

  function csvEscape(value){
    var s = String(value === undefined || value === null ? "" : value);
    if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function buildExportRows(habits, monthEntries){
    var header = ["Day", "Date", "Score"].concat(habits.map(function(h){ return h.name; }));
    var rows = [header];
    Object.keys(monthEntries).sort().forEach(function(mk){
      var parts = mk.split("-");
      var y = Number(parts[0]), m = Number(parts[1]) - 1;
      if (isNaN(y) || isNaN(m)) return;
      var n = daysInMonth(y, m);
      var entries = monthEntries[mk] || {};
      for (var d = 1; d <= n; d++){
        var dk = dateKeyOf(y, m, d);
        var dayEntry = entries[dk] || {};
        var dateObj = new Date(y, m, d);
        var res = scoreForEntry(dayEntry);
        var row = [dateObj.toLocaleDateString("en-US", { weekday: "long" }), dk, res.score + "/" + res.max];
        habits.forEach(function(h){
          var v = dayEntry[h.id];
          if (h.type === "check"){
            row.push(v ? "TRUE" : "FALSE");
          } else if (v === undefined || v === null || v === ""){
            row.push("");
          } else if (h.type === "time"){
            row.push(formatTime12(v));
          } else {
            row.push(String(v));
          }
        });
        rows.push(row);
      }
    });
    return rows;
  }

  function downloadBlob(content, mimeType, filename){
    var blob = new Blob([content], { type: mimeType });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function showExportStatus(msg){
    state.exportStatus = msg;
    render();
    setTimeout(function(){
      if (state.exportStatus === msg){ state.exportStatus = null; render(); }
    }, 5000);
  }

  function runExport(format){
    showExportStatus("Preparing export\u2026");
    collectAllStoredMonths().then(function(monthEntries){
      monthEntries[monthKey(state.year, state.month)] = state.entries;
      var habits = state.config.habits;

      if (format === "json"){
        var payload = {
          exportedAt: new Date().toISOString(),
          config: state.config,
          entries: monthEntries
        };
        downloadBlob(JSON.stringify(payload, null, 2), "application/json", "habit-tracker-export.json");
        showExportStatus("Exported habit-tracker-export.json");
        return;
      }

      var rows = buildExportRows(habits, monthEntries);

      if (format === "csv"){
        var csv = rows.map(function(row){ return row.map(csvEscape).join(","); }).join("\r\n");
        downloadBlob(csv, "text/csv", "habit-tracker-export.csv");
        showExportStatus("Exported habit-tracker-export.csv \u2014 import into Sheets or Notion");
        return;
      }

      if (format === "xlsx"){
        if (typeof XLSX === "undefined"){
          showExportStatus("Excel export unavailable right now \u2014 try CSV instead");
          return;
        }
        var ws = XLSX.utils.aoa_to_sheet(rows);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Habit Tracker");
        XLSX.writeFile(wb, "habit-tracker-export.xlsx");
        showExportStatus("Exported habit-tracker-export.xlsx");
      }
    }).catch(function(e){
      console.error("Export failed", e);
      showExportStatus("Export failed \u2014 please try again");
    });
  }

  // ---------- import ----------

  function handleImportFile(file){
    if (!file) return Promise.resolve();
    showExportStatus("Reading file\u2026");
    return file.text().then(function(text){
      var data;
      try {
        data = JSON.parse(text);
      } catch (e){
        showExportStatus("That file isn\u2019t valid JSON \u2014 import cancelled");
        return;
      }
      // Accept both the current export shape (config + entries) and the
      // older shape (habits + entries) from before colors were included.
      var config = data.config || (data.habits ? { habits: data.habits } : null);
      if (!config || !Array.isArray(config.habits) || typeof data.entries !== "object" || !data.entries){
        showExportStatus("That doesn\u2019t look like a habit tracker backup \u2014 import cancelled");
        return;
      }
      state.pendingImportData = { config: config, entries: data.entries };
      state.confirmImportOpen = true;
      render();
    }).catch(function(e){
      console.error("Failed to read import file", e);
      showExportStatus("Couldn\u2019t read that file \u2014 import cancelled");
    });
  }

  function applyImport(){
    var data = state.pendingImportData;
    if (!data) return;
    state.confirmImportOpen = false;
    state.pendingImportData = null;

    // Update what's on screen immediately, the same way every other change
    // in this app works (check a box, edit a habit) - the visible result
    // never waits on a network round trip first. Persisting to storage
    // happens afterward, in the background; a slow or flaky write there
    // shouldn't stall or partially apply what you see.
    state.config = data.config;
    state.rhythmFilter = null;
    state.yearEntries = null;
    state.yearEntriesYear = null;
    var curKey = monthKey(state.year, state.month);
    state.entries = data.entries[curKey] || {};
    render();
    showExportStatus("Backup restored");

    saveConfig();
    var monthKeys = Object.keys(data.entries);
    monthKeys.forEach(function(mk){
      window.storage.set("habit-ledger:entries:" + mk, JSON.stringify(data.entries[mk])).catch(function(e){
        console.error("Failed to persist imported month " + mk, e);
      });
    });
  }

  // ---------- share ----------

  function buildShareText(){
    var n = daysInMonth(state.year, state.month);
    var elapsed = relevantDaysElapsed(state.year, state.month) || 1;
    var lines = [];
    state.config.habits.forEach(function(h){
      var isGoal = h.type === "check" || (h.type === "time" && h.target) || (h.type === "number" && hasNumberTarget(h));
      if (!isGoal) return;
      var count = 0;
      for (var d = 1; d <= n; d++){
        var dk = dateKeyOf(state.year, state.month, d);
        var entry = state.entries[dk] || {};
        if (isHabitDoneForDay(h, entry)) count++;
      }
      lines.push(h.icon + " " + h.name + ": " + count + "/" + elapsed);
    });
    var header = "\uD83D\uDCCA My " + MONTH_NAMES[state.month] + " " + state.year + " habit tracker:";
    if (!lines.length) return header + "\nNo goal habits tracked yet.";
    return header + "\n" + lines.join("\n");
  }

    var cellsHtml = "";
    for (var i = 0; i < firstWeekday; i++){ cellsHtml += '<div class="cell empty"></div>'; }
    for (var d = 1; d <= n; d++){
      var dk = dateKeyOf(y, m, d);
      var entry = state.entries[dk] || {};
      var res = scoreForEntry(entry);
      var color = colorForScore(res.score);
      cellsHtml += '<div class="cell" style="background:' + color + '" title="' + res.score + '/' + res.max + ' habits met">' + d + '</div>';
    }

      var isGoal = h.type === "check" || (h.type === "time" && h.target) || (h.type === "number" && hasNumberTarget(h));
      if (!isGoal) return "";

  function shareSnapshot(){
    var html = buildSnapshotHtml();
    var filename = "habit-tracker-" + monthKey(state.year, state.month) + ".html";
    var file = null;
    try { file = new File([html], filename, { type: "text/html" }); } catch(e){ file = null; }

    if (file && navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ files: [file], title: "Habit Tracker", text: buildShareText() }).catch(function(err){
        if (err && err.name === "AbortError") return;
        downloadBlob(html, "text/html", filename);
        showExportStatus("Downloaded " + filename + " \u2014 share it from your files app");
      });
    } else {
      downloadBlob(html, "text/html", filename);
      showExportStatus("Downloaded " + filename + " \u2014 share it from your files app");
    }
  }

  function syncYearCache(){
    if (state.yearEntriesYear === state.year && state.yearEntries){
      state.yearEntries = Object.assign({}, state.yearEntries);
      state.yearEntries[state.month] = state.entries;
    }
  }

  function saveEntries(){
    return window.storage.set(entriesKey(state.year, state.month), JSON.stringify(state.entries)).catch(function(e){
      console.error("Failed to save entries", e);
    });

  // ---------- derived data ----------

  function checkHabits(){
    return state.config.habits.filter(function(h){ return h.type === "check"; });
  }

  // habits that can be "met" or "missed" on a given day: plain checkboxes,
  // plus time habits that have an optimal target time set
  function goalHabits(){
    return state.config.habits.filter(function(h){
      return h.type === "check" || (h.type === "time" && h.target) || (h.type === "number" && hasNumberTarget(h));
    });
  }

  function hasNumberTarget(h){
    return h.target !== undefined && h.target !== null && h.target !== "" && !isNaN(Number(h.target));
  }

  function isHabitDoneForDay(h, dayEntry){
    if (h.type === "check") return !!dayEntry[h.id];
    if (h.type === "time" && h.target){
      var val = dayEntry[h.id];
      if (!val) return false;
      var t = timeToMinutes(h.target);
      var a = timeToMinutes(val);
      if (t === null || a === null) return false;
      // treat the night as continuous so a target of e.g. 11pm and an
      // actual time just after midnight still compare correctly
      if (t >= 720 && a < 720) a += 1440;
      else if (a >= 720 && t < 720) t += 1440;
      var diff = a - t;
      return h.rule === "after" ? diff >= 0 : diff <= 0;
    }
    if (h.type === "number" && hasNumberTarget(h)){
      var nval = dayEntry[h.id];
      if (nval === undefined || nval === null || nval === "") return false;
      var num = Number(nval), targetNum = Number(h.target);
      if (isNaN(num) || isNaN(targetNum)) return false;
      return h.rule === "below" ? num <= targetNum : num >= targetNum;
    }
    return false;
  }

  function scoreForEntry(dayEntry){
    var goals = goalHabits();
    var score = goals.reduce(function(acc,h){ return acc + (isHabitDoneForDay(h, dayEntry) ? 1 : 0); }, 0);
    return { score: score, max: goals.length };
  }

  function scoreForDate(dk){
    return scoreForEntry(state.entries[dk] || {}).score;
  }

  function maxScore(){ return goalHabits().length; }

  function relevantDaysElapsed(y,m){
    var n = getNow();
    var isPast = (y < n.getFullYear()) || (y === n.getFullYear() && m < n.getMonth());
    var isCurrent = (y === n.getFullYear() && m === n.getMonth());
    if (isPast) return daysInMonth(y,m);
    if (isCurrent) return n.getDate();
    return 0;
  }

  // ---------- actions ----------

  function toggleHabit(dk, habitId){
    var day = state.entries[dk] ? Object.assign({}, state.entries[dk]) : {};
    day[habitId] = !day[habitId];
    state.entries = Object.assign({}, state.entries);
    state.entries[dk] = day;
    syncYearCache();
    saveEntries();
    render();
  }

  var numberSaveTimer = null;

  function applyNumberChange(dk, habitId, rawValue){
    var day = state.entries[dk] ? Object.assign({}, state.entries[dk]) : {};
    if (rawValue === "" || rawValue === null || isNaN(Number(rawValue))) {
      delete day[habitId];
    } else {
      day[habitId] = Number(rawValue);
    }
    state.entries = Object.assign({}, state.entries);
    state.entries[dk] = day;
    syncYearCache();
  }

  function setNumber(dk, habitId, rawValue){
    applyNumberChange(dk, habitId, rawValue);
    if (numberSaveTimer){ clearTimeout(numberSaveTimer); numberSaveTimer = null; }
    saveEntries();
    render();
  }

  // Live update while typing: a plain number input doesn't have the
  // "premature complete value" quirk time inputs have, so it's safe to
  // reflect it in the score/calendar as each digit is typed rather than
  // waiting until the field is left. Saving to storage is still debounced
  // so we're not writing on every keystroke.
  function setNumberLive(dk, habitId, rawValue){
    applyNumberChange(dk, habitId, rawValue);
    render();
    if (numberSaveTimer) clearTimeout(numberSaveTimer);
    numberSaveTimer = setTimeout(function(){
      saveEntries();
      numberSaveTimer = null;
    }, 600);
  }

  function setTime(dk, habitId, rawValue){
    var day = state.entries[dk] ? Object.assign({}, state.entries[dk]) : {};
    if (!rawValue) {
      delete day[habitId];
    } else {
      day[habitId] = rawValue;
    }
    state.entries = Object.assign({}, state.entries);
    state.entries[dk] = day;
    syncYearCache();
    saveEntries();
    render();
  }

  function goMonth(delta){
    var d = new Date(state.year, state.month + delta, 1);
    var yearChanged = d.getFullYear() !== state.year;
    state.year = d.getFullYear();
    state.month = d.getMonth();
    state.loading = true;
    render();
    loadEntries(state.year, state.month).then(function(entries){
      state.entries = entries;
      state.loading = false;
      if (yearChanged && state.rhythmView === "year") ensureYearEntriesLoaded();
      render();
    });
  }

  function goYear(delta){
    state.year += delta;
    state.loading = true;
    render();
    Promise.all([loadEntries(state.year, state.month), loadYearEntries(state.year)]).then(function(results){
      state.entries = results[0];
      state.yearEntries = results[1];
      state.yearEntriesYear = state.year;
      state.loading = false;
      render();
    });
  }

  function addHabit(name, icon, type, target, rule, newColor){
    var habit = { id: uid(), name: name, icon: icon || "\u2726", type: type, target: target || "", rule: rule || "before" };
    var updatedConfig = { habits: state.config.habits.concat([habit]) };
    if (newColor){
      var priorColors = computeScoreColorsFor(maxScore());
      updatedConfig.scoreColors = priorColors.concat([newColor]);
    }
    state.config = Object.assign({}, state.config, updatedConfig);
    state.addPanelOpen = false;
    saveConfig();
    render();
  }

  function updateHabit(habitId, changes){
    state.config = Object.assign({}, state.config, {
      habits: state.config.habits.map(function(h){
        return h.id === habitId ? Object.assign({}, h, changes) : h;
      })
    });
    state.editingHabitId = null;
    saveConfig();
    render();
  }

  function removeHabit(habitId){
    if (state.rhythmFilter === habitId) state.rhythmFilter = null;
    state.config = Object.assign({}, state.config, {
      habits: state.config.habits.filter(function(h){ return h.id !== habitId; })
    });
    state.confirmRemoveId = null;
    saveConfig();
    render();
  }

  function reorderHabits(draggedId, targetId){
    if (draggedId === targetId) return;
    var habits = state.config.habits.slice();
    var fromIdx = habits.findIndex(function(h){ return h.id === draggedId; });
    var toIdx = habits.findIndex(function(h){ return h.id === targetId; });
    if (fromIdx === -1 || toIdx === -1) return;
    var moved = habits.splice(fromIdx, 1)[0];
    habits.splice(toIdx, 0, moved);
    state.config = Object.assign({}, state.config, { habits: habits });
    saveConfig();
    render();
  }

  function resetMonth(){
    state.entries = {};
    syncYearCache();
    saveEntries();
    state.confirmResetOpen = false;
    render();
  }

  // ---------- rendering ----------

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function sectionGap(){
    return '<div class="section-gap"></div>';
  }

  function renderIconField(idPrefix, currentIcon){
    var displayIcon = state.pendingIconValue !== null ? state.pendingIconValue : (currentIcon || "\u2726");
    var picker = "";
    if (state.emojiPickerOpen === idPrefix){
      var query = state.emojiSearchQuery.trim().toLowerCase();
      var matches = query ? EMOJI_LIBRARY.filter(function(e){ return e[1].indexOf(query) !== -1; }) : EMOJI_LIBRARY;
      var grid = matches.map(function(e){
        return '<button type="button" class="emoji-option" data-action="pick-emoji" data-emoji="' + e[0] + '" data-prefix="' + idPrefix + '" title="' + e[1].split(" ")[0] + '">' + e[0] + '</button>';
      }).join("");
      picker = '<div class="emoji-picker">' +
        '<input type="text" class="emoji-search" id="' + idPrefix + '-emoji-search" placeholder="Search, or scroll to browse\u2026" value="' + escapeHtml(state.emojiSearchQuery) + '" data-action="emoji-search" data-prefix="' + idPrefix + '" autocomplete="off">' +
        '<div class="emoji-grid">' + (grid || '<span class="emoji-empty">No matches</span>') + '</div>' +
        '<div class="emoji-custom-row">' +
          '<label for="' + idPrefix + '-emoji-custom">Or type your own</label>' +
          '<input type="text" id="' + idPrefix + '-emoji-custom" maxlength="2" value="' + (state.pendingIconValue !== null ? escapeHtml(state.pendingIconValue) : "") + '" placeholder="\u2726" data-action="custom-emoji" data-prefix="' + idPrefix + '">' +
        '</div>' +
        '</div>';
    }
    return '<div class="add-field icon-field">' +
      '<label>Icon</label>' +
      '<button type="button" class="emoji-trigger" data-action="toggle-emoji-picker" data-prefix="' + idPrefix + '">' + displayIcon + '</button>' +
      '<input type="hidden" id="' + idPrefix + '-icon" value="' + escapeHtml(displayIcon) + '">' +
      picker +
      '</div>';
  }

  function renderTargetFields(idPrefix, type, target, rule){
    var timeVisible = type === "time";
    var numberVisible = type === "number";
    var timeBlock = '<div class="time-target-fields" id="' + idPrefix + '-time-target-wrap" style="display:' + (timeVisible ? "flex" : "none") + ';">' +
      '<div class="add-field"><label for="' + idPrefix + '-target">Optimal time</label><input id="' + idPrefix + '-target" type="time" value="' + (timeVisible ? (target || "") : "") + '"></div>' +
      '<div class="add-field"><label for="' + idPrefix + '-rule">Counts if logged</label><select id="' + idPrefix + '-rule">' +
        '<option value="before"' + (rule !== "after" ? " selected" : "") + '>At or before</option>' +
        '<option value="after"' + (rule === "after" ? " selected" : "") + '>At or after</option>' +
      '</select></div>' +
    '</div>';
    var numberBlock = '<div class="time-target-fields" id="' + idPrefix + '-number-target-wrap" style="display:' + (numberVisible ? "flex" : "none") + ';">' +
      '<div class="add-field"><label for="' + idPrefix + '-num-target">Target number</label><input id="' + idPrefix + '-num-target" type="number" value="' + (numberVisible ? (target || "") : "") + '"></div>' +
      '<div class="add-field"><label for="' + idPrefix + '-num-rule">Counts if logged</label><select id="' + idPrefix + '-num-rule">' +
        '<option value="above"' + (rule !== "below" ? " selected" : "") + '>At or above</option>' +
        '<option value="below"' + (rule === "below" ? " selected" : "") + '>At or below</option>' +
      '</select></div>' +
    '</div>';
    return timeBlock + numberBlock;
  }

  function getFilterDoneColor(){
    return state.config.filterDoneColor || "#268A4E";
  }

  function computeDayInfo(y, m, d, entriesForMonth){
    var dk = dateKeyOf(y, m, d);
    var dayEntry = entriesForMonth[dk] || {};
    if (!state.rhythmFilter){
      var res = scoreForEntry(dayEntry);
      var color = colorForScore(res.score);
      var tooltip = MONTH_NAMES[m] + " " + d + ": " + res.score + "/" + res.max + " habits met";
      return { color: color, tooltip: tooltip };
    }
    var habit = state.config.habits.find(function(h){ return h.id === state.rhythmFilter; });
    if (!habit) return { color: colorForScore(0), tooltip: "" };
    var val = dayEntry[habit.id];
    var detail, done;
    if (habit.type === "check"){
      done = !!val;
      detail = done ? "Checked" : "Not checked";
    } else if (habit.type === "time"){
      var logged = val !== undefined && val !== null && val !== "";
      if (habit.target){
        done = logged && isHabitDoneForDay(habit, dayEntry);
        detail = logged ? (formatTime12(val) + (done ? " \u2014 goal met" : " \u2014 goal missed")) : "No entry";
      } else {
        done = logged;
        detail = logged ? formatTime12(val) : "No entry";
      }
    } else if (habit.type === "number"){
      var loggedNum = val !== undefined && val !== null && val !== "";
      if (hasNumberTarget(habit)){
        done = loggedNum && isHabitDoneForDay(habit, dayEntry);
        detail = loggedNum ? (String(val) + (done ? " \u2014 goal met" : " \u2014 goal missed")) : "No entry";
      } else {
        done = loggedNum;
        detail = loggedNum ? String(val) : "No entry";
      }
    } else {
      done = val !== undefined && val !== null && val !== "";
      detail = done ? String(val) : "No entry";
    }
    var colors = getScoreColors();
    return {
      color: done ? getFilterDoneColor() : colors[0],
      tooltip: MONTH_NAMES[m] + " " + d + " \u2014 " + habit.name + ": " + detail
    };
  }

  function renderLegend(){
    var colors = getScoreColors();
    return state.rhythmFilter ?
      '<div class="rhythm-legend"><span class="swatch" style="background:' + colors[0] + '"></span>Not done' +
        '<span class="swatch" style="background:' + getFilterDoneColor() + '; margin-left:10px;"></span>Done' +
        ' <button class="colors-edit-link" data-action="toggle-color-editor">Edit colors</button></div>' :
      '<div class="rhythm-legend">Less' +
        colors.map(function(c){ return '<span class="swatch" style="background:' + c + '"></span>'; }).join("") +
        'More <button class="colors-edit-link" data-action="toggle-color-editor">Edit colors</button></div>';
  }

  function renderMonthGrid(){
    var n = daysInMonth(state.year, state.month);
    var firstWeekday = new Date(state.year, state.month, 1).getDay();

    var weekdayHeader = '<div class="cal-weekdays">' +
      ["S","M","T","W","T","F","S"].map(function(w){ return "<span>" + w + "</span>"; }).join("") +
      '</div>';

    var cells = "";
    for (var i = 0; i < firstWeekday; i++){
      cells += '<div class="cal-cell empty"></div>';
    }
    for (var d = 1; d <= n; d++){
      var info = computeDayInfo(state.year, state.month, d, state.entries);
      var isToday = (function(){ var n = getNow(); return state.year === n.getFullYear() && state.month === n.getMonth() && d === n.getDate(); })();
      cells += '<div class="cal-cell' + (isToday ? " today" : "") +
        '" style="background:' + info.color + '; color:' + textColorFor(info.color) + '" title="' + info.tooltip + '">' +
        d +
        '</div>';
    }

    return '<div class="calendar-wrap">' +
      weekdayHeader +
      '<div class="calendar-grid">' + cells + '</div>' +
      renderLegend() +
      '</div>';
  }

  function renderYearGrid(){
    if (state.yearLoading || !state.yearEntries || state.yearEntriesYear !== state.year){
      return '<div class="year-loading">Loading the year&hellip;</div>';
    }
    var nowD = getNow();
    var cards = "";
    for (var m = 0; m < 12; m++){
      var entriesForMonth = state.yearEntries[m] || {};
      var n = daysInMonth(state.year, m);
      var firstWeekday = new Date(state.year, m, 1).getDay();
      var cellsHtml = "";
      for (var i = 0; i < firstWeekday; i++){
        cellsHtml += '<div class="mini-cal-cell empty"></div>';
      }
      for (var d = 1; d <= n; d++){
        var info = computeDayInfo(state.year, m, d, entriesForMonth);
        var isToday = (state.year === nowD.getFullYear() && m === nowD.getMonth() && d === nowD.getDate());
        cellsHtml += '<div class="mini-cal-cell' + (isToday ? " today" : "") + '" style="background:' +
          info.color + '" title="' + info.tooltip + '" data-action="goto-month" data-month="' + m + '"></div>';
      }
      cards += '<div class="mini-month">' +
        '<p class="mini-month-title" data-action="goto-month" data-month="' + m + '">' + MONTH_NAMES[m] + '</p>' +
        '<div class="mini-cal-grid">' + cellsHtml + '</div>' +
        '</div>';
    }
    return '<div class="year-grid">' + cards + '</div>' + renderLegend();
  }

  function renderRhythm(){
    var habits = state.config.habits;

    var activeHabit = state.rhythmFilter ? habits.find(function(h){ return h.id === state.rhythmFilter; }) : null;
    var triggerLabel = activeHabit ? (activeHabit.icon + " " + escapeHtml(activeHabit.name)) : "All habits";

    var dropdownMenu = "";
    if (state.rhythmDropdownOpen){
      dropdownMenu = '<div class="filter-dropdown">' +
        '<button class="filter-option' + (state.rhythmFilter ? "" : " active") + '" data-action="filter-rhythm" data-habit="">All habits</button>' +
        habits.map(function(h){
          return '<button class="filter-option' + (state.rhythmFilter === h.id ? " active" : "") +
            '" data-action="filter-rhythm" data-habit="' + h.id + '">' + h.icon + " " + escapeHtml(h.name) + '</button>';
        }).join("") +
        '</div>';
    }

    var filterRow = '<div class="rhythm-filter">' +
      '<button class="filter-trigger" data-action="toggle-rhythm-dropdown"><span>' + triggerLabel + '</span><span class="chevron">' +
      (state.rhythmDropdownOpen ? "&#9650;" : "&#9660;") + '</span></button>' +
      dropdownMenu +
      '</div>';

    var viewToggle = '<div class="view-toggle">' +
      '<button data-action="set-rhythm-view" data-view="month" class="' + (state.rhythmView === "month" ? "active" : "") + '">Month</button>' +
      '<button data-action="set-rhythm-view" data-view="year" class="' + (state.rhythmView === "year" ? "active" : "") + '">Year</button>' +
      '</div>';

    var yearNav = state.rhythmView === "year" ?
      '<div class="year-nav">' +
        '<button data-action="prev-year" aria-label="Previous year">&lsaquo;</button>' +
        '<span>' + state.year + '</span>' +
        '<button data-action="next-year" aria-label="Next year">&rsaquo;</button>' +
      '</div>' : "";

    return '<div class="rhythm">' +
      '<div class="rhythm-controls">' + viewToggle + yearNav + '</div>' +
      '<p class="rhythm-label">' + (state.rhythmView === "year" ? "Yearly rhythm" : "Monthly rhythm") + '</p>' +
      filterRow +
      (state.rhythmView === "year" ? renderYearGrid() : renderMonthGrid()) +
      '</div>';
  }

  function renderTable(){
    var habits = state.config.habits;
    var n = daysInMonth(state.year, state.month);

    var thead = '<tr><th>Day</th><th>Date</th>';
    habits.forEach(function(h){
      thead += '<th class="habit-col" draggable="true" data-habit-id="' + h.id + '">' +
        '<span class="drag-handle" aria-hidden="true">&#8942;&#8942;</span>' +
        '<span class="habit-col-actions">' +
          '<button class="edit-habit" data-action="ask-edit" data-habit="' + h.id + '" aria-label="Edit ' + escapeHtml(h.name) + '">&#9998;</button>' +
          '<button class="remove-habit" data-action="ask-remove" data-habit="' + h.id + '" aria-label="Remove ' + escapeHtml(h.name) + '">&times;</button>' +
        '</span>' +
        '<span class="habit-col-inner"><span class="habit-icon">' + h.icon + '</span><span class="habit-name">' + escapeHtml(h.name) + '</span></span>' +
        '</th>';
    });
    thead += '<th>Score</th><th class="add-habit-col"><button class="add-habit-btn" data-action="toggle-add" aria-label="Add habit">+</button></th></tr>';

    var rows = "";
    for (var d = 1; d <= n; d++){
      var dateObj = new Date(state.year, state.month, d);
      var dk = dateKeyOf(state.year, state.month, d);
      var dayOfWeek = dateObj.getDay();
      var isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
      var isToday = (function(){ var n = getNow(); return state.year === n.getFullYear() && state.month === n.getMonth() && d === n.getDate(); })();
      var dayName = dateObj.toLocaleDateString("en-US", { weekday: "long" });
      var dayEntry = state.entries[dk] || {};

      var cells = '<td class="day-cell"><span class="day-name">' + dayName + '</span><br><span class="day-date">' +
        MONTH_NAMES[state.month] + " " + d + '</span></td>' +
        '<td class="day-date">' + monthKey(state.year, state.month) + '-' + pad(d) + '</td>';

      habits.forEach(function(h){
        if (h.type === "check"){
          var checked = !!dayEntry[h.id];
          cells += '<td class="habit-cell"><button class="check-btn' + (checked ? " checked" : "") +
            '" role="checkbox" aria-checked="' + checked + '" data-action="toggle" data-date="' + dk +
            '" data-habit="' + h.id + '">' + (checked ? "&#10003;" : "") + '</button></td>';
        } else if (h.type === "time"){
          var tval = (dayEntry[h.id] === undefined || dayEntry[h.id] === null) ? "" : dayEntry[h.id];
          cells += '<td class="habit-cell"><input class="time-input" type="time" value="' + tval +
            '" data-action="time" data-date="' + dk + '" data-habit="' + h.id + '"></td>';
        } else {
          var val = (dayEntry[h.id] === undefined || dayEntry[h.id] === null) ? "" : dayEntry[h.id];
          cells += '<td class="habit-cell"><input class="num-input" type="number" inputmode="numeric" value="' + val +
            '" data-action="number" data-date="' + dk + '" data-habit="' + h.id + '" placeholder="&ndash;"></td>';
        }
      });

      cells += '<td class="score-cell">' + scoreForDate(dk) + '</td><td></td>';

      rows += '<tr class="' + (isWeekend ? "weekend " : "") + (isToday ? "today" : "") + '">' + cells + '</tr>';
    }

    var elapsed = relevantDaysElapsed(state.year, state.month) || 1;
    var tfoot = '<tr><td colspan="2">Done this month</td>';
    habits.forEach(function(h){
      if (h.type === "check"){
        var count = 0;
        for (var d2 = 1; d2 <= n; d2++){
          var dk2 = dateKeyOf(state.year, state.month, d2);
          if (state.entries[dk2] && state.entries[dk2][h.id]) count++;
        }
        tfoot += '<td class="habit-cell">' + count + '</td>';
      } else if (h.type === "time"){
        var tvals = [];
        var metCountFoot = 0;
        for (var d3t = 1; d3t <= n; d3t++){
          var dk3t = dateKeyOf(state.year, state.month, d3t);
          var dayEntryFoot = state.entries[dk3t] || {};
          var vt = dayEntryFoot[h.id];
          var mins = vt ? timeToMinutes(vt) : null;
          if (mins !== null) tvals.push(mins);
          if (h.target && isHabitDoneForDay(h, dayEntryFoot)) metCountFoot++;
        }
        var avgTime = tvals.length ? formatTime12(minutesToTime(circularMeanMinutes(tvals))) : "&ndash;";
        tfoot += '<td class="habit-cell">' + (h.target ? ("met " + metCountFoot + " &middot; avg " + avgTime) : ("avg " + avgTime)) + '</td>';
      } else {
        var vals = [];
        var metCountFootNum = 0;
        for (var d3 = 1; d3 <= n; d3++){
          var dk3 = dateKeyOf(state.year, state.month, d3);
          var dayEntryFootN = state.entries[dk3] || {};
          var v = dayEntryFootN[h.id];
          if (v !== undefined && v !== null && v !== "") vals.push(v);
          if (hasNumberTarget(h) && isHabitDoneForDay(h, dayEntryFootN)) metCountFootNum++;
        }
        var avg = vals.length ? Math.round(vals.reduce(function(a,b){return a+Number(b);},0) / vals.length) : "&ndash;";
        tfoot += '<td class="habit-cell">' + (hasNumberTarget(h) ? ("met " + metCountFootNum + " &middot; avg " + avg) : ("avg " + avg)) + '</td>';
      }
    });
    tfoot += '<td></td><td></td></tr>';

    var addPanel = "";
    if (state.addPanelOpen){
      var currentColors = getScoreColors();
      var previewNewColor = defaultColorScale(currentColors.length + 1)[currentColors.length];
      var colorPreview = '<div class="new-color-preview" id="new-habit-color-wrap" style="display:flex; flex-direction:column;">' +
        '<p>A checkbox or time-goal habit adds one more step to your calendar\u2019s color scale. Here\u2019s the current scale, plus the new color it introduces:</p>' +
        '<div class="existing-scale-strip">' + currentColors.map(function(c){ return '<span class="swatch" style="background:' + c + '"></span>'; }).join("") + '</div>' +
        '<div class="color-editor-row">' +
          '<span class="swatch-preview" style="background:' + previewNewColor + '"></span>' +
          '<span class="color-editor-label">New: ' + currentColors.length + ' habits met</span>' +
          '<input type="color" id="new-habit-color" value="' + previewNewColor + '">' +
        '</div>' +
        '</div>';
      addPanel = '<div class="add-panel">' +
        renderIconField("new-habit", "") +
        '<div class="add-field"><label for="new-habit-name">Habit name</label><input id="new-habit-name" type="text" placeholder="e.g. Stretch"></div>' +
        '<div class="add-field"><label for="new-habit-type">Type</label><select id="new-habit-type"><option value="check">Checkbox</option><option value="number">Number</option><option value="time">Time</option></select></div>' +
        renderTargetFields("new-habit", "check", "", "before") +
        colorPreview +
        '<button class="btn btn-primary" data-action="confirm-add">Add habit</button>' +
        '<button class="btn btn-ghost" data-action="cancel-add">Cancel</button>' +
        '</div>';
    }

    return '<div class="table-section">' +
      '<p class="section-heading">Daily log</p>' +
      '<div class="ledger-table-wrap"><table class="ledger">' +
      '<thead>' + thead + '</thead>' +
      '<tbody>' + rows + '</tbody>' +
      '<tfoot>' + tfoot + '</tfoot>' +
      '</table></div>' + addPanel +
      '</div>';
  }

  function renderStats(){
    var habits = state.config.habits;
    var n = daysInMonth(state.year, state.month);
    var elapsed = relevantDaysElapsed(state.year, state.month);

    var cards = habits.map(function(h){
      if (h.type === "check"){
        var count = 0;
        for (var d = 1; d <= n; d++){
          var dk = dateKeyOf(state.year, state.month, d);
          if (state.entries[dk] && state.entries[dk][h.id]) count++;
        }
        var pct = elapsed > 0 ? Math.round((count / elapsed) * 100) : 0;
        return '<div class="stat-card">' +
          '<div class="stat-card-top"><span class="habit-icon">' + h.icon + '</span><span class="habit-name">' + escapeHtml(h.name) + '</span></div>' +
          '<div class="stat-value">' + count + ' / ' + elapsed + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + Math.min(pct,100) + '%"></div></div>' +
          '</div>';
      } else if (h.type === "time"){
        var tvals2 = [];
        var metCount = 0;
        for (var dt = 1; dt <= n; dt++){
          var dkt = dateKeyOf(state.year, state.month, dt);
          var dayEntryT = state.entries[dkt] || {};
          var vt2 = dayEntryT[h.id];
          var mins2 = vt2 ? timeToMinutes(vt2) : null;
          if (mins2 !== null) tvals2.push(mins2);
          if (h.target && isHabitDoneForDay(h, dayEntryT)) metCount++;
        }
        var avgT = tvals2.length ? formatTime12(minutesToTime(circularMeanMinutes(tvals2))) : null;
        if (h.target){
          var pctT = elapsed > 0 ? Math.round((metCount / elapsed) * 100) : 0;
          return '<div class="stat-card">' +
            '<div class="stat-card-top"><span class="habit-icon">' + h.icon + '</span><span class="habit-name">' + escapeHtml(h.name) + '</span></div>' +
            '<div class="stat-value">' + metCount + ' / ' + elapsed + '</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + Math.min(pctT,100) + '%"></div></div>' +
            '<div class="stat-subline">avg ' + (avgT === null ? "&ndash;" : avgT) + ' &middot; goal ' + (h.rule === "after" ? "after " : "before ") + formatTime12(h.target) + '</div>' +
            '</div>';
        }
        return '<div class="stat-card">' +
          '<div class="stat-card-top"><span class="habit-icon">' + h.icon + '</span><span class="habit-name">' + escapeHtml(h.name) + '</span></div>' +
          '<div class="stat-value">' + (avgT === null ? "&ndash;" : avgT) + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + (tvals2.length ? "100" : "0") + '%; background: var(--moss);"></div></div>' +
          '</div>';
      } else {
        var vals = [];
        var metCountNum = 0;
        for (var d2 = 1; d2 <= n; d2++){
          var dk2 = dateKeyOf(state.year, state.month, d2);
          var dayEntryN = state.entries[dk2] || {};
          var v = dayEntryN[h.id];
          if (v !== undefined && v !== null && v !== "") vals.push(v);
          if (hasNumberTarget(h) && isHabitDoneForDay(h, dayEntryN)) metCountNum++;
        }
        var avg = vals.length ? Math.round(vals.reduce(function(a,b){return a+Number(b);},0) / vals.length) : null;
        if (hasNumberTarget(h)){
          var pctN = elapsed > 0 ? Math.round((metCountNum / elapsed) * 100) : 0;
          return '<div class="stat-card">' +
            '<div class="stat-card-top"><span class="habit-icon">' + h.icon + '</span><span class="habit-name">' + escapeHtml(h.name) + '</span></div>' +
            '<div class="stat-value">' + metCountNum + ' / ' + elapsed + '</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + Math.min(pctN,100) + '%"></div></div>' +
            '<div class="stat-subline">avg ' + (avg === null ? "&ndash;" : avg) + ' &middot; goal ' + (h.rule === "below" ? "at or below " : "at or above ") + h.target + '</div>' +
            '</div>';
        }
        return '<div class="stat-card">' +
          '<div class="stat-card-top"><span class="habit-icon">' + h.icon + '</span><span class="habit-name">' + escapeHtml(h.name) + '</span></div>' +
          '<div class="stat-value">' + (avg === null ? "&ndash;" : avg) + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + (vals.length ? "100" : "0") + '%; background: var(--moss);"></div></div>' +
          '</div>';
      }
    }).join("");

    return '<div class="stats-head"><h2 class="section-heading">This month at a glance</h2></div>' +
      '<div class="stats-grid">' + cards + '</div>';
  }

  // ---------- event delegation ----------

  document.addEventListener("dragstart", function(e){
    var th = e.target.closest("th.habit-col");

    e.dataTransfer.setData("text/plain", th.getAttribute("data-habit-id"));
    e.dataTransfer.effectAllowed = "move";
    th.classList.add("dragging");
  });

  document.addEventListener("dragover", function(e){
    var th = e.target.closest("th.habit-col");
    if (!th) return;
    e.preventDefault();
    th.classList.add("drag-over");
  });

  document.addEventListener("dragleave", function(e){
    var th = e.target.closest("th.habit-col");
    if (!th) return;
    th.classList.remove("drag-over");
  });

  document.addEventListener("drop", function(e){
    var th = e.target.closest("th.habit-col");
    if (!th) return;
    e.preventDefault();
    th.classList.remove("drag-over");
    var draggedId = e.dataTransfer.getData("text/plain");
    var targetId = th.getAttribute("data-habit-id");
    if (draggedId && targetId) reorderHabits(draggedId, targetId);
  });

  document.addEventListener("dragend", function(){
    var cols = document.querySelectorAll("th.habit-col.dragging, th.habit-col.drag-over");
    cols.forEach(function(el){ el.classList.remove("dragging"); el.classList.remove("drag-over"); });
  });

  document.addEventListener("click", function(e){
    var somethingWasOpen = state.rhythmDropdownOpen || state.exportMenuOpen || state.emojiPickerOpen;
    if (state.rhythmDropdownOpen && !e.target.closest(".rhythm-filter")){
      state.rhythmDropdownOpen = false;
    }
    if (state.exportMenuOpen && !e.target.closest(".export-control")){
      state.exportMenuOpen = false;
    }
    if (state.emojiPickerOpen && !e.target.closest(".icon-field")){
      state.emojiPickerOpen = false;
    }

    var target = e.target.closest("[data-action]");
    if (!target){
      if (somethingWasOpen && !state.rhythmDropdownOpen && !state.exportMenuOpen && !state.emojiPickerOpen) render();
      return;
    }
    var action = target.getAttribute("data-action");

    // clicking inside a modal card should never trigger the backdrop's close action
    if (target.classList.contains("modal-overlay") && e.target !== target) return;

    if (action === "toggle"){
      toggleHabit(target.getAttribute("data-date"), target.getAttribute("data-habit"));
    } else if (action === "prev-month"){
      goMonth(-1);
    } else if (action === "next-month"){
      goMonth(1);
    } else if (action === "toggle-add"){
      state.addPanelOpen = !state.addPanelOpen;
      state.emojiPickerOpen = false;
      state.emojiSearchQuery = "";
      state.pendingIconValue = null;
      render();
    } else if (action === "cancel-add"){
      state.addPanelOpen = false;
      state.emojiPickerOpen = false;
      state.pendingIconValue = null;
      render();
    } else if (action === "confirm-add"){
      var nameEl = document.getElementById("new-habit-name");
      var iconEl = document.getElementById("new-habit-icon");
      var typeEl = document.getElementById("new-habit-type");
      var targetEl = document.getElementById("new-habit-target");
      var ruleEl = document.getElementById("new-habit-rule");
      var numTargetEl = document.getElementById("new-habit-num-target");
      var numRuleEl = document.getElementById("new-habit-num-rule");
      var colorEl = document.getElementById("new-habit-color");
      var name = (nameEl.value || "").trim();
      if (!name) { nameEl.focus(); return; }
      var addTarget = "", addRule = "before";
      if (typeEl.value === "time"){ addTarget = targetEl.value; addRule = ruleEl.value; }
      else if (typeEl.value === "number"){ addTarget = numTargetEl.value; addRule = numRuleEl.value; }
      state.emojiPickerOpen = false;
      state.pendingIconValue = null;
      addHabit(name, (iconEl.value || "").trim(), typeEl.value, addTarget, addRule, colorEl ? colorEl.value : null);
    } else if (action === "ask-edit"){
      state.editingHabitId = target.getAttribute("data-habit");
      state.emojiPickerOpen = false;
      state.emojiSearchQuery = "";
      state.pendingIconValue = null;
      render();
    } else if (action === "cancel-edit"){
      state.editingHabitId = null;
      state.emojiPickerOpen = false;
      state.pendingIconValue = null;
      render();
    } else if (action === "confirm-edit"){
      var editNameEl = document.getElementById("edit-habit-name");
      var editIconEl = document.getElementById("edit-habit-icon");
      var editTypeEl = document.getElementById("edit-habit-type");
      var editTargetEl = document.getElementById("edit-habit-target");
      var editRuleEl = document.getElementById("edit-habit-rule");
      var editNumTargetEl = document.getElementById("edit-habit-num-target");
      var editNumRuleEl = document.getElementById("edit-habit-num-rule");
      var editedName = (editNameEl.value || "").trim();
      if (!editedName) { editNameEl.focus(); return; }
      var editTarget = "", editRule = "before";
      if (editTypeEl.value === "time"){ editTarget = editTargetEl.value; editRule = editRuleEl.value; }
      else if (editTypeEl.value === "number"){ editTarget = editNumTargetEl.value; editRule = editNumRuleEl.value; }
      state.emojiPickerOpen = false;
      state.pendingIconValue = null;
      updateHabit(target.getAttribute("data-habit"), {
        name: editedName,
        icon: (editIconEl.value || "").trim() || "\u2726",
        type: editTypeEl.value,
        target: editTarget,
        rule: editRule
      });
    } else if (action === "toggle-emoji-picker"){
      var iconPrefix = target.getAttribute("data-prefix");
      if (state.emojiPickerOpen === iconPrefix){
        state.emojiPickerOpen = false;
      } else {
        var hiddenIcon = document.getElementById(iconPrefix + "-icon");
        state.pendingIconValue = hiddenIcon ? hiddenIcon.value : "";
        state.emojiSearchQuery = "";
        state.emojiPickerOpen = iconPrefix;
      }
      render();
    } else if (action === "pick-emoji"){
      state.pendingIconValue = target.getAttribute("data-emoji");
      state.emojiPickerOpen = false;
      render();
    } else if (action === "toggle-rhythm-dropdown"){
      state.rhythmDropdownOpen = !state.rhythmDropdownOpen;
      render();
    } else if (action === "toggle-export-menu"){
      state.exportMenuOpen = !state.exportMenuOpen;
      render();
    } else if (action === "confirm-import"){
      applyImport();
    } else if (action === "cancel-import"){
      state.confirmImportOpen = false;
      state.pendingImportData = null;
      render();
    } else if (action === "share-snapshot"){
      shareSnapshot();
    } else if (action === "toggle-color-editor"){
      state.colorEditorOpen = true;
      render();
    } else if (action === "cancel-color-editor"){
      state.colorEditorOpen = false;
      render();
    } else if (action === "reset-score-colors"){
      var maxNow = maxScore();
      state.config = Object.assign({}, state.config, { scoreColors: defaultColorScale(maxNow + 1), filterDoneColor: "" });
      saveConfig();
      render();
    } else if (action === "export-data"){
      state.exportMenuOpen = false;
      render();
      runExport(target.getAttribute("data-format"));
    } else if (action === "filter-rhythm"){
      state.rhythmFilter = target.getAttribute("data-habit") || null;
      state.rhythmDropdownOpen = false;
      render();
    } else if (action === "set-rhythm-view"){
      state.rhythmView = target.getAttribute("data-view");
      if (state.rhythmView === "year") ensureYearEntriesLoaded();
      render();
    } else if (action === "prev-year"){
      goYear(-1);
    } else if (action === "next-year"){
      goYear(1);
    } else if (action === "goto-month"){
      var targetMonth = Number(target.getAttribute("data-month"));
      state.month = targetMonth;
      state.entries = (state.yearEntries && state.yearEntries[targetMonth]) || {};
      state.rhythmView = "month";
      render();
    } else if (action === "ask-remove"){
      state.confirmRemoveId = target.getAttribute("data-habit");
      render();
    } else if (action === "cancel-remove"){
      state.confirmRemoveId = null;
      render();
    } else if (action === "do-remove"){
      removeHabit(target.getAttribute("data-habit"));
    } else if (action === "ask-reset"){
      state.confirmResetOpen = true;
      render();
    } else if (action === "cancel-reset"){
      state.confirmResetOpen = false;
      render();
    } else if (action === "confirm-reset"){
      resetMonth();
    }
  });

  document.addEventListener("change", function(e){
    var target = e.target;
    if (target.id === "import-file-input"){
      var file = target.files && target.files[0];
      var oldInputEl = target;
      handleImportFile(file).then(function(){
        // Only touch the DOM once the read is fully done, so we never risk
        // pulling the element (and its in-flight file data) out from under
        // an active read - that race was causing intermittent failures.
        var freshFileInput = oldInputEl.cloneNode(true);
        freshFileInput.value = "";
        if (oldInputEl.parentNode) oldInputEl.parentNode.replaceChild(freshFileInput, oldInputEl);
      });
      return;
    }
    if (target.matches && target.matches('[data-action="set-score-color"]')){
      var idx = Number(target.getAttribute("data-index"));
      var colors = getScoreColors().slice();
      colors[idx] = target.value;
      state.config = Object.assign({}, state.config, { scoreColors: colors });
      saveConfig();
      render();
    } else if (target.matches && target.matches('[data-action="set-filter-done-color"]')){
      state.config = Object.assign({}, state.config, { filterDoneColor: target.value });
      saveConfig();
      render();
    }
  });

  // Committed on focusout (not 'change'): a time input can report a fully
  // "complete" value after a single keystroke when you're overwriting an
  // existing time (the old minute/second still fills the rest), which fired
  // 'change' before you'd finished typing and re-rendering mid-edit yanked
  // the field out from under you. Waiting until the field is actually left
  // avoids that, while Enter (below) still lets you commit immediately.
  document.addEventListener("input", function(e){
    var target = e.target;
    if (target.matches && target.matches('[data-action="number"]')){
      var d = target.getAttribute("data-date"), h = target.getAttribute("data-habit");
      var cursorPos = target.selectionStart;
      setNumberLive(d, h, target.value);
      var freshInput = document.querySelector('input[data-action="number"][data-date="' + d + '"][data-habit="' + h + '"]');
      if (freshInput){
        freshInput.focus();
        try { freshInput.setSelectionRange(cursorPos, cursorPos); } catch(err){}
      }
    } else if (target.matches && target.matches('[data-action="emoji-search"]')){
      var searchPrefix = target.getAttribute("data-prefix");
      var searchCursor = target.selectionStart;
      state.emojiSearchQuery = target.value;
      render();
      var freshSearch = document.getElementById(searchPrefix + "-emoji-search");
      if (freshSearch){
        freshSearch.focus();
        try { freshSearch.setSelectionRange(searchCursor, searchCursor); } catch(err){}
      }
    } else if (target.matches && target.matches('[data-action="custom-emoji"]')){
      var customPrefix = target.getAttribute("data-prefix");
      var customCursor = target.selectionStart;
      state.pendingIconValue = target.value;
      render();
      var freshCustom = document.getElementById(customPrefix + "-emoji-custom");
      if (freshCustom){
        freshCustom.focus();
        try { freshCustom.setSelectionRange(customCursor, customCursor); } catch(err){}
      }
    }
  });

  document.addEventListener("focusout", function(e){
    var target = e.target;
    if (target.matches && target.matches('[data-action="number"]')){
      setNumber(target.getAttribute("data-date"), target.getAttribute("data-habit"), target.value);
    } else if (target.matches && target.matches('[data-action="time"]')){
      setTime(target.getAttribute("data-date"), target.getAttribute("data-habit"), target.value);
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Enter" && e.target.matches && (e.target.matches('[data-action="number"]') || e.target.matches('[data-action="time"]'))){
      e.target.blur();
    }
    if (e.key === "Escape" && state.emojiPickerOpen){
      state.emojiPickerOpen = false;
      render();
      return;
    }
    if (e.key === "Escape" && (state.editingHabitId || state.confirmRemoveId || state.confirmResetOpen || state.rhythmDropdownOpen || state.exportMenuOpen || state.colorEditorOpen || state.confirmImportOpen)){
      state.editingHabitId = null;
      state.confirmRemoveId = null;
      state.confirmResetOpen = false;
      state.rhythmDropdownOpen = false;
      state.exportMenuOpen = false;
      state.colorEditorOpen = false;
      state.confirmImportOpen = false;
      state.pendingImportData = null;
      render();
    }
  });

  // ---------- keep "today" accurate without a manual refresh ----------

  var lastKnownDateStr = getNow().toDateString();

  function checkForDayChange(){
    var current = getNow().toDateString();
    if (current !== lastKnownDateStr){
      lastKnownDateStr = current;
      if (!state.loading) render();
    }
  }

  setInterval(checkForDayChange, 60000);
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible") checkForDayChange();
  });

  // ---------- init ----------

  Promise.all([loadConfig(), loadEntries(state.year, state.month)]).then(function(results){
    state.config = results[0];
    state.entries = results[1];
    state.loading = false;
    render();
  }).catch(function(e){
    console.error("Failed to load habit ledger data", e);
    state.config = defaultConfig();
    state.entries = {};
    state.loading = false;
    render();
  });

})();
</script>
</body>
</html>
